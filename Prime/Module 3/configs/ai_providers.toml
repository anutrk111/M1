# Defaults for M03 AI Provider Gateway (no secrets).
# Operational engineering defaults, not contractual or legal policy.

[ai]
# fixture: offline fixture provider allowed in routes (CI).
# live: any fixture-kind provider in a route is a boot-time Config error.
default_mode = "fixture"
# Upper bound when resolving file:// bytes_ref inputs.
max_request_image_bytes = 26214400

[ai.timeouts_ms]
detect = 10000
ocr = 15000
hsrp = 15000
vlm = 30000

[ai.retry]
# Additional attempts after the first; Transient errors only.
max_retries = 2
base_delay_ms = 200
max_delay_ms = 5000

[ai.vlm]
enabled = true
# Operational guidance only (M08 decides when to invoke VLM); not enforced by the gateway.
max_fraction = 0.05

# Per-provider token bucket (override per provider with [ai.providers.<name>.rate_limit]).
# requests_per_second <= 0 disables limiting.
[ai.rate_limit]
requests_per_second = 10.0
burst = 20

# Consecutive Transient failures open the circuit; after open_ms one probe is allowed.
[ai.circuit_breaker]
failure_threshold = 5
open_ms = 30000
half_open_max_calls = 1

# OCR tie-breaker ("Emperor"): secondary consulted on consensus calls, arbiter only on
# disagreement. Opinions are evidence; M06 grammar still decides.
[ai.tie_breaker]
enabled = false
# secondary = "provider_b"
# arbiter = "emperor"

[ai.operations.detect]
primary = "fixture"
fallbacks = []

[ai.operations.ocr]
primary = "fixture"
fallbacks = []

[ai.operations.hsrp]
primary = "fixture"
fallbacks = []

[ai.operations.vlm]
primary = "fixture"
fallbacks = []

# Example real provider (disabled until a key exists). kind = "http_json" speaks the
# Talos normalized wire format (see docs/M03_IMPLEMENTATION_REPORT.md).
# [ai.providers.provider_a]
# enabled = false
# kind = "http_json"
# base_url = "https://provider-a.example/talos"
# detect_model = ""
# ocr_model = ""
# hsrp_model = ""
# vlm_model = ""
# API key env (default): TALOS__AI__PROVIDER_A__API_KEY
