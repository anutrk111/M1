[intake]
staging_root = "./data/staging"
max_images_per_batch = 10000
max_zip_bytes = 536870912
max_image_bytes = 26214400
max_uncompressed_zip_bytes = 1073741824
max_zip_entries = 50000
fail_on_empty_batch = true
fail_batch_on_metadata_errors = false
fail_batch_on_sink_errors = false
max_width = 8192
max_height = 8192
max_pixel_count = 25000000
allowed_extensions = ["jpg", "jpeg", "png"]
# retain | plan_only | plan_batch_dir — affects plan_cleanup() output only; M02 never deletes staging.
staging_policy = "retain"
