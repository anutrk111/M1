# M09 review defaults (starting points — not SLA guarantees)

[review]
# Always queue ReviewRequired. SecondaryVerification only when enabled.
include_secondary = false
include_review_required = true

[review.lease]
ttl_seconds = 900
# Optimistic concurrency: submit must carry expected version
require_version = true

[review.roles]
# Requirements for M12 — not implemented here
officer = "review_officer"
lead = "review_lead"
