[workspace]
resolver = "2"
members = [
    "crates/talos-types",
    "crates/talos-config",
    "crates/talos-core",
    "crates/observability",
    "apps/talos-api",
    "apps/talos-worker",
    "apps/review-api",
    "apps/admin-gateway",
    "crates/talos-intake",
]
default-members = [
    "crates/talos-types",
    "crates/talos-config",
    "crates/talos-core",
    "crates/observability",
    "apps/talos-worker",
    "crates/talos-intake",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["Talos-RS"]
rust-version = "1.75"

[workspace.dependencies]
talos-types = { path = "crates/talos-types" }
talos-config = { path = "crates/talos-config" }
talos-core = { path = "crates/talos-core" }
observability = { path = "crates/observability" }
talos-intake = { path = "crates/talos-intake" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
figment = { version = "0.10", features = ["toml", "env"] }
sha2 = "0.10"
blake3 = "1"
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
hex = "0.4"
